<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Residential tower illustration">
  <defs>
    <linearGradient id="tsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f3eb"/>
      <stop offset=".6" stop-color="#eee2cc"/>
      <stop offset="1" stop-color="#e8dfd0"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a5542"/>
      <stop offset="1" stop-color="#123527"/>
    </linearGradient>
    <linearGradient id="towerSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f7338"/>
      <stop offset="1" stop-color="#6e5827"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#tsky)"/>
  <circle cx="210" cy="170" r="90" fill="#d4b56a" opacity=".5"/>
  <!-- main tower -->
  <polygon points="430,120 770,150 770,830 430,830" fill="url(#tower)"/>
  <polygon points="770,150 900,230 900,830 770,830" fill="url(#towerSide)"/>
  <!-- balconies: layered slabs -->
  <g fill="#d4b56a" opacity=".92">
    <rect x="404" y="200" width="392" height="16" rx="8"/>
    <rect x="404" y="290" width="392" height="16" rx="8"/>
    <rect x="404" y="380" width="392" height="16" rx="8"/>
    <rect x="404" y="470" width="392" height="16" rx="8"/>
    <rect x="404" y="560" width="392" height="16" rx="8"/>
    <rect x="404" y="650" width="392" height="16" rx="8"/>
  </g>
  <!-- glazing strips -->
  <g fill="#f4eee2" opacity=".28">
    <rect x="450" y="216" width="300" height="74"/>
    <rect x="450" y="306" width="300" height="74"/>
    <rect x="450" y="396" width="300" height="74"/>
    <rect x="450" y="486" width="300" height="74"/>
    <rect x="450" y="576" width="300" height="74"/>
    <rect x="450" y="666" width="300" height="74"/>
  </g>
  <!-- side windows -->
  <g fill="#f4eee2" opacity=".22">
    <rect x="800" y="260" width="80" height="60"/>
    <rect x="800" y="360" width="80" height="60"/>
    <rect x="800" y="460" width="80" height="60"/>
    <rect x="800" y="560" width="80" height="60"/>
  </g>
  <!-- crown -->
  <rect x="560" y="84" width="80" height="40" fill="#0f2419"/>
  <!-- ground -->
  <path d="M0 830 Q400 796 760 826 T1200 818 V900 H0 Z" fill="#1a3c2e"/>
  <!-- trees -->
  <g fill="#123527">
    <ellipse cx="150" cy="790" rx="70" ry="52"/>
    <rect x="138" y="820" width="22" height="50" fill="#0f2419"/>
    <ellipse cx="1060" cy="800" rx="78" ry="56"/>
    <rect x="1046" y="832" width="24" height="48" fill="#0f2419"/>
  </g>
</svg>
