<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Bungalow with garden illustration">
  <defs>
    <linearGradient id="bsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f3eb"/>
      <stop offset=".62" stop-color="#f0e5cf"/>
      <stop offset="1" stop-color="#e8dfd0"/>
    </linearGradient>
    <linearGradient id="bwall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4eee2"/>
      <stop offset="1" stop-color="#ddd0b8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bsky)"/>
  <circle cx="980" cy="180" r="88" fill="#d4b56a" opacity=".55"/>
  <!-- bungalow -->
  <rect x="240" y="430" width="720" height="230" fill="url(#bwall)"/>
  <polygon points="210,440 600,300 990,440" fill="#1a3c2e"/>
  <rect x="196" y="428" width="808" height="18" rx="8" fill="#0f2419"/>
  <!-- windows / door -->
  <g fill="#123527">
    <rect x="300" y="500" width="120" height="100"/>
    <rect x="480" y="500" width="110" height="160"/>
    <rect x="660" y="500" width="120" height="100"/>
    <rect x="840" y="500" width="90" height="160"/>
  </g>
  <g stroke="#d4b56a" stroke-width="6">
    <line x1="360" y1="504" x2="360" y2="596"/>
    <line x1="720" y1="504" x2="720" y2="596"/>
  </g>
  <circle cx="497" cy="586" r="6" fill="#b8954a"/>
  <!-- orchard -->
  <g>
    <ellipse cx="130" cy="700" rx="70" ry="54" fill="#2a5542"/>
    <rect x="122" y="740" width="16" height="44" fill="#0f2419"/>
    <ellipse cx="1080" cy="690" rx="76" ry="58" fill="#2a5542"/>
    <rect x="1070" y="734" width="18" height="48" fill="#0f2419"/>
    <ellipse cx="380" cy="742" rx="52" ry="40" fill="#3d6b52"/>
    <ellipse cx="820" cy="746" rx="56" ry="42" fill="#3d6b52"/>
  </g>
  <!-- fruit dots -->
  <g fill="#d4b56a">
    <circle cx="112" cy="686" r="9"/><circle cx="152" cy="712" r="9"/><circle cx="368" cy="730" r="8"/><circle cx="400" cy="752" r="8"/><circle cx="1064" cy="678" r="9"/><circle cx="1102" cy="706" r="9"/>
  </g>
  <!-- low wall -->
  <rect x="80" y="780" width="1040" height="22" fill="#c4b5a0"/>
  <path d="M0 800 Q400 782 800 798 T1200 792 V900 H0 Z" fill="#1a3c2e"/>
</svg>
