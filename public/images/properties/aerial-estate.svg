<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Estate aerial layout illustration">
  <defs>
    <linearGradient id="aground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe6d2"/>
      <stop offset="1" stop-color="#dccbaa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#aground)"/>
  <!-- estate boundary -->
  <rect x="90" y="90" width="1020" height="720" fill="#f4eee2" stroke="#1a3c2e" stroke-width="14"/>
  <!-- perimeter fence ticks -->
  <g stroke="#8f7338" stroke-width="6">
    <line x1="150" y1="90" x2="150" y2="130"/><line x1="300" y1="90" x2="300" y2="130"/><line x1="450" y1="90" x2="450" y2="130"/><line x1="600" y1="90" x2="600" y2="130"/><line x1="750" y1="90" x2="750" y2="130"/><line x1="900" y1="90" x2="900" y2="130"/><line x1="1050" y1="90" x2="1050" y2="130"/>
    <line x1="150" y1="810" x2="150" y2="770"/><line x1="300" y1="810" x2="300" y2="770"/><line x1="450" y1="810" x2="450" y2="770"/><line x1="600" y1="810" x2="600" y2="770"/><line x1="750" y1="810" x2="750" y2="770"/><line x1="900" y1="810" x2="900" y2="770"/><line x1="1050" y1="810" x2="1050" y2="770"/>
  </g>
  <!-- roads -->
  <rect x="90" y="400" width="1020" height="56" fill="#c4b5a0"/>
  <rect x="520" y="90" width="56" height="720" fill="#c4b5a0"/>
  <line x1="90" y1="428" x2="1110" y2="428" stroke="#fdf9f0" stroke-width="6" stroke-dasharray="30 26" opacity=".8"/>
  <line x1="548" y1="90" x2="548" y2="810" stroke="#fdf9f0" stroke-width="6" stroke-dasharray="30 26" opacity=".8"/>
  <!-- plots quadrant A -->
  <g fill="#e3d7c2" stroke="#8f7338" stroke-width="6">
    <rect x="140" y="140" width="160" height="110"/>
    <rect x="330" y="140" width="160" height="110"/>
    <rect x="140" y="280" width="160" height="100"/>
    <rect x="330" y="280" width="160" height="100"/>
    <rect x="620" y="140" width="180" height="110"/>
    <rect x="840" y="140" width="220" height="110"/>
    <rect x="620" y="280" width="180" height="100"/>
    <rect x="840" y="280" width="220" height="100"/>
    <rect x="140" y="500" width="160" height="130"/>
    <rect x="330" y="500" width="160" height="130"/>
    <rect x="140" y="660" width="350" height="110"/>
    <rect x="620" y="500" width="440" height="270" fill="#d4b56a" opacity=".55"/>
  </g>
  <!-- green buffer -->
  <g fill="#2a5542">
    <ellipse cx="255" cy="245" rx="34" ry="24"/>
    <ellipse cx="710" cy="245" rx="34" ry="24"/>
    <ellipse cx="255" cy="480" rx="34" ry="24"/>
  </g>
  <!-- gatehouse -->
  <circle cx="548" cy="806" r="26" fill="#b8954a"/>
</svg>
