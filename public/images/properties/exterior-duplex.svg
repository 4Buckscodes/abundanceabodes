<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Contemporary duplex illustration">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f3eb"/>
      <stop offset=".65" stop-color="#efe6d6"/>
      <stop offset="1" stop-color="#e8dfd0"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a5542"/>
      <stop offset="1" stop-color="#0f2419"/>
    </linearGradient>
    <linearGradient id="wallA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4eee2"/>
      <stop offset="1" stop-color="#ddd0b8"/>
    </linearGradient>
    <linearGradient id="wallB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f7338"/>
      <stop offset="1" stop-color="#6e5827"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#sky)"/>
  <circle cx="950" cy="190" r="110" fill="#d4b56a" opacity=".55"/>
  <circle cx="950" cy="190" r="150" fill="#d4b56a" opacity=".18"/>
  <!-- rear mass -->
  <rect x="180" y="330" width="520" height="360" fill="url(#wallA)"/>
  <polygon points="160,340 440,220 720,340" fill="#1a3c2e"/>
  <!-- tower volume -->
  <rect x="700" y="250" width="300" height="450" fill="url(#wallB)"/>
  <rect x="688" y="238" width="324" height="26" fill="#0f2419"/>
  <!-- balcony -->
  <rect x="730" y="380" width="240" height="14" fill="#0f2419"/>
  <g stroke="#0f2419" stroke-width="5">
    <line x1="740" y1="386" x2="740" y2="452"/>
    <line x1="786" y1="386" x2="786" y2="452"/>
    <line x1="832" y1="386" x2="832" y2="452"/>
    <line x1="878" y1="386" x2="878" y2="452"/>
    <line x1="924" y1="386" x2="924" y2="452"/>
    <line x1="962" y1="386" x2="962" y2="452"/>
    <line x1="735" y1="452" x2="965" y2="452"/>
  </g>
  <!-- windows main -->
  <g fill="#1a3c2e" opacity=".85">
    <rect x="230" y="400" width="90" height="130"/>
    <rect x="370" y="400" width="90" height="130"/>
    <rect x="510" y="400" width="140" height="60"/>
    <rect x="230" y="580" width="200" height="70"/>
    <rect x="750" y="480" width="200" height="80"/>
    <rect x="750" y="600" width="200" height="70"/>
  </g>
  <!-- door -->
  <rect x="500" y="580" width="80" height="112" fill="#1a3c2e"/>
  <circle cx="512" cy="636" r="5" fill="#d4b56a"/>
  <!-- ground -->
  <path d="M0 690 Q300 650 620 686 T1200 676 V900 H0 Z" fill="url(#ground)"/>
  <path d="M0 730 Q420 700 830 730 T1200 722 V900 H0 Z" fill="#1a3c2e"/>
  <!-- driveway -->
  <polygon points="430,900 560,900 700,700 640,694" fill="#c4b5a0" opacity=".25"/>
  <!-- palms -->
  <g stroke="#123527" stroke-width="10" fill="none" stroke-linecap="round">
    <path d="M120 700 C118 620 122 560 116 520"/>
    <path d="M1080 710 C1082 640 1078 590 1084 550"/>
  </g>
  <g fill="#2a5542">
    <ellipse cx="92" cy="512" rx="52" ry="18" transform="rotate(-28 92 512)"/>
    <ellipse cx="146" cy="506" rx="52" ry="18" transform="rotate(22 146 506)"/>
    <ellipse cx="1048" cy="544" rx="48" ry="17" transform="rotate(-26 1048 544)"/>
    <ellipse cx="1122" cy="540" rx="48" ry="17" transform="rotate(24 1122 540)"/>
  </g>
</svg>
